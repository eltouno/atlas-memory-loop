[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "atlas-memory-loop"
version = "0.2.0"
description = "Markdown-first persistent memory loop for agentic AI hosts"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Antoine" }]
keywords = ["agents", "ai-memory", "markdown", "mcp", "obsidian"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["mcp>=2.0,<3"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "hatchling>=1.27",
  "pytest>=8.0",
  "ruff>=0.9",
]

[project.scripts]
atlas-memory = "atlas_memory.cli:main"

[project.urls]
Homepage = "https://github.com/eltouno/atlas-memory-loop"
Repository = "https://github.com/eltouno/atlas-memory-loop"
Issues = "https://github.com/eltouno/atlas-memory-loop/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_memory"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
